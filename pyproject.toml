[project]
name = "insurance-facts"
version = "0.1.0"
description = "少儿险条款事实对比工具 — 只做客观对比，不做推荐"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[project.scripts]
insurance-validate = "insurance.validate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]]